[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-plotter"
version = "0.1.0"
description = "Real-time serial port data visualization"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Nils Graß", email = "nils.grass+github@gmail.com"}
]
keywords = ["serial", "plotting", "visualization", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyserial>=3.5",
    "PyQt6>=6.5.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "black>=23.0",
]

[project.scripts]
serial-plotter = "serial_plotter.cli:main"

[tool.setuptools.packages.find]
include = ["serial_plotter*"]

[project.urls]
Homepage = "https://github.com/yourusername/python_serial_plotter"
Repository = "https://github.com/yourusername/python_serial_plotter"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
